name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        timeout-minutes: 5
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        # --build-number ties versionCode to the CI run, which always
        # increases — the debug key is pinned (see debug.keystore) so a
        # signature match is never the problem, but without a rising
        # versionCode too, Android has been known to treat re-installing
        # an APK it considers "the same version" as a no-op on some OEM
        # installers instead of actually replacing it. This also makes
        # the running build visible under Settings > Apps > Uchi.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-chinese-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
