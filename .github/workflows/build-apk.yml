name: Build Android APK and Windows Installer

on:
  push:
    # The repo's actual branch is master — this used to say "main", which
    # meant a push here never auto-triggered a build; every APK before
    # this comment was a manually dispatched run.
    branches: [master]
  workflow_dispatch: {}

jobs:
  test:
    # Shared gate for both platform builds — Dart tests are OS-agnostic,
    # so running them once here instead of again inside each build job
    # halves the CI time that would otherwise go to duplicate test runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install libc++ and graphics dev headers
        # thermion_dart's native-assets hook compiles its Linux build with
        # clang -stdlib=libc++, but ubuntu-latest only ships libstdc++ by
        # default — without this, every native asset build (triggered by
        # `pub get`/analyze/test resolving the mascot's 3D dependency)
        # fails on missing standard headers like <cstdint>. It then links
        # against -lEGL -lGL -lgbm -ldrm, which need the *-dev packages
        # (the unversioned .so symlinks) rather than just the runtime libs
        # ubuntu-latest ships by default.
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev libdrm-dev

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        timeout-minutes: 5
        run: flutter test

  build-android:
    needs: test
    runs-on: ubuntu-latest
    # Needed for the release step below to create/update a GitHub Release
    # with the default GITHUB_TOKEN — that token is read-only by default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        # --build-number ties versionCode to the CI run, which always
        # increases — the debug key is pinned (see debug.keystore) so a
        # signature match is never the problem, but without a rising
        # versionCode too, Android has been known to treat re-installing
        # an APK it considers "the same version" as a no-op on some OEM
        # installers instead of actually replacing it. This also makes
        # the running build visible under Settings > Apps > Uchi.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-chinese-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish a GitHub Release
        # This is what the in-app update check reads: AppUpdateService
        # asks the GitHub API for the latest release, compares its tag's
        # number against the running app's build number, and offers the
        # matching attached asset (.apk here, the Windows installer from
        # the job below) as the download. The tag is exactly the run
        # number so that comparison is a plain integer diff, not a semver
        # parse. workflow_dispatch runs don't get a real push event/SHA
        # to release from, so this only runs for actual pushes.
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: mobile/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    needs: [test, build-android]
    # Depends on build-android (not just test) so the release for this
    # tag already exists by the time this job attaches to it — two jobs
    # racing to create the same release from scratch is exactly the kind
    # of thing that only fails intermittently.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build release Windows app
        working-directory: mobile
        run: flutter build windows --release --build-number=${{ github.run_number }}

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the installer
        # Packages the release build (exe + plugin DLLs + data/) into one
        # self-contained UchiSetup.exe — see windows/installer/uchi.iss
        # for why: sharing a folder of files means someone has to keep
        # them all together, sharing one installer doesn't.
        working-directory: mobile
        run: ISCC.exe windows\installer\uchi.iss

      - uses: actions/upload-artifact@v4
        with:
          name: uchi-windows-installer
          path: mobile/build/installer/UchiSetup.exe

      - name: Attach the installer to the same release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: mobile/build/installer/UchiSetup.exe
