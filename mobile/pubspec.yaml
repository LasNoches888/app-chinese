name: app_chinese
description: MVP Chinese learning app — SRS flashcards + AI text chat tutor.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.3
  stroke_order_animator: ^3.3.1
  flutter_gemma: ^1.5.9
  flutter_gemma_litertlm: ^1.4.2
  flutter_gemma_mediapipe: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/seed/words.json
    - assets/seed/decks.json
    - assets/seed/stroke_data.json
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon_source.png"
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
