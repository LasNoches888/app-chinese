name: app_chinese
description: MVP Chinese learning app — SRS flashcards + AI text chat tutor.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.3
  stroke_order_animator: ^3.3.1
  llamadart: ^0.8.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/seed/words.json
    - assets/seed/decks.json
    - assets/seed/stroke_data.json
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon_source.png"
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Only ship the llama.cpp runtime (not litert_lm, which we don't use) and
# only its CPU backend (no vulkan/opencl) — the local tutor is a 1.5B GGUF
# model, CPU inference is fine, and this keeps both the one-time native
# runtime download and the final APK a lot smaller.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes:
        platforms:
          android-arm64: [llama_cpp]
          windows-x64: [llama_cpp]
          linux-x64: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu]
            cpu_profile: full
          windows-x64:
            backends: [cpu]
          linux-x64:
            backends: [cpu]
