name: app_chinese
description: MVP Chinese learning app — SRS flashcards + AI text chat tutor.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.3
  stroke_order_animator: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/seed/words.json
    - assets/seed/decks.json
    - assets/seed/stroke_data.json
